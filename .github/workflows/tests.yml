name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.godot-ci
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        run: tools/ci/install_godot.sh

      - name: Run GUT tests and validate questions
        run: GODOT="$HOME/.godot-ci/godot" bash tools/run_tests.sh
